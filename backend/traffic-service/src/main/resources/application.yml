spring:
  application:
    name: traffic-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trafficdb}
    username: ${SPRING_DATASOURCE_USERNAME:smartcity}
    password: ${SPRING_DATASOURCE_PASSWORD:smartcity}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
server:
  port: 8083
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
