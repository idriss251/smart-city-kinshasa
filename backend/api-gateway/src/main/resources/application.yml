spring:
  application: { name: api-gateway }
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]': { allowedOrigins: "*", allowedMethods: "*", allowedHeaders: "*" }
      routes:
        - { id: auth, uri: lb://auth-service, predicates: [Path=/api/auth/**] }
        - { id: users, uri: lb://auth-service, predicates: [Path=/api/users/**] }
        - { id: betterauth, uri: http://better-auth-service:8089, predicates: [Path=/api/betterauth/**] }
        - { id: waste, uri: lb://waste-service, predicates: [Path=/api/waste/**] }
        - { id: road, uri: lb://road-service, predicates: [Path=/api/road/**] }
        - { id: flood, uri: lb://flood-service, predicates: [Path=/api/flood/**] }
        - { id: citizen, uri: lb://citizen-service, predicates: [Path=/api/citizen/**] }
        - { id: gis, uri: lb://gis-service, predicates: [Path=/api/gis/**] }
        - { id: iot, uri: lb://iot-service, predicates: [Path=/api/iot/**] }
        - { id: dashboard, uri: lb://dashboard-service, predicates: [Path=/api/dashboard/**] }
server: { port: 8080 }
eureka: { client: { service-url: { defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}" } } }
